[target.arm-unknown-linux-gnueabihf]
linker = "arm-unknown-linux-gnueabihf-gcc"
rustflags = [
    "-C", "panic=abort",
    "-C", "link-arg=-lgcc_s",
    "-C", "opt-level=z"
]
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
rustflags = [
    "-C", "panic=abort",
    "-C", "link-arg=-lgcc_s",
    "-C", "opt-level=z"
]
